<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walker Works — Websites for trades on the Mid North Coast</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .card {
    max-width: 720px;
    text-align: center;
    padding: 3rem 2rem;
    border: 1px solid #30363d;
    border-radius: 12px;
    background: #161b22;
  }
  h1 {
    font-size: 2.2rem;
    line-height: 1.2;
    margin-bottom: 1.5rem;
    color: #ffffff;
  }
  p {
    font-size: 1.15rem;
    line-height: 1.6;
    color: #c9d1d9;
    margin-bottom: 2rem;
  }
  .built {
    font-size: 0.95rem;
    color: #8b949e;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Websites for trades on the Mid North Coast</h1>
    <p>A three page site, built and live in five business days. Built once, owned forever, no ongoing fees.</p>
    <p class="built">Built by Walker Works</p>
  </div>
</body>
</html>
